<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Kruth Client main menu preview</title>
  <desc id="desc">Minecraft-style title screen with a dark blurred forest panorama, player name, top-right utility icons including Discord, centered Kruth Client logo, Singleplayer and Multiplayer buttons, and no Partner tile.</desc>
  <defs>
    <linearGradient id="sky" x2="0.9" y2="1"><stop stop-color="#101722"/><stop offset=".52" stop-color="#182638"/><stop offset="1" stop-color="#101711"/></linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#141914"/><stop offset=".43" stop-color="#24302b"/><stop offset=".72" stop-color="#172331"/><stop offset="1" stop-color="#0c1219"/></linearGradient>
    <linearGradient id="vignette" x2="0" y2="1"><stop stop-color="#000" stop-opacity=".32"/><stop offset=".5" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".62"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="3"/><feComponentTransfer><feFuncA type="linear" slope=".65"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.mc{font-family:Arial,sans-serif;letter-spacing:-.3px}.pixel{image-rendering:pixelated}</style>
  </defs>
  <!-- Approximation of Minecraft's blurred title panorama; the mod leaves the live game background untouched. -->
  <rect width="1200" height="675" fill="url(#sky)"/>
  <g filter="url(#blur)" opacity=".9">
    <path d="M0 0h250l65 675H0Z" fill="#11190f"/>
    <path d="M225 0h150l-40 675H170Z" fill="#27321d"/>
    <path d="M390 0h90l55 675H330Z" fill="#0a1118"/>
    <path d="M520 0h185l-80 675H490Z" fill="#182a3b"/>
    <path d="M690 0h110l-15 675H630Z" fill="#0c1723"/>
    <path d="M825 0h145l-65 675H760Z" fill="#1b2c39"/>
    <path d="M1000 0h200v675H935Z" fill="#101913"/>
    <ellipse cx="190" cy="112" rx="115" ry="125" fill="#69702a" opacity=".42"/>
    <ellipse cx="342" cy="205" rx="86" ry="120" fill="#59652a" opacity=".45"/>
    <ellipse cx="916" cy="488" rx="195" ry="145" fill="#42552e" opacity=".45"/>
    <ellipse cx="557" cy="586" rx="250" ry="95" fill="#34402a" opacity=".55"/>
    <path d="M400 0h7v675h-7zm292 0h8v675h-8zm243 0h7v675h-7z" fill="#637084" opacity=".5"/>
  </g>
  <rect width="1200" height="675" fill="url(#mist)" opacity=".35"/>
  <rect width="1200" height="675" fill="url(#vignette)"/>
  <!-- thin inset frame -->
  <rect x="12" y="12" width="1176" height="651" rx="12" fill="none" stroke="#000" stroke-opacity=".38" stroke-width="2"/>
  <!-- player/name plate -->
  <rect x="24" y="24" width="219" height="38" rx="12" fill="#050609" fill-opacity=".77" stroke="#fff" stroke-opacity=".08"/>
  <rect x="32" y="30" width="25" height="25" rx="4" fill="#7e604b"/>
  <rect x="36" y="34" width="17" height="7" fill="#bc9972"/><rect x="36" y="43" width="6" height="7" fill="#24212a"/><rect x="47" y="43" width="6" height="7" fill="#24212a"/>
  <text x="66" y="49" fill="#f1f0ee" font-size="16" font-weight="600">That0neDipu</text>
  <!-- top-right outlined action icons -->
  <g transform="translate(961 30)" fill="none" stroke="#f2f1ef" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <rect x="0" y="0" width="29" height="29" rx="7" fill="#080a0d" fill-opacity=".5" stroke-opacity=".8"/>
    <rect x="6" y="6" width="17" height="17" rx="2"/><circle cx="18" cy="10" r="2"/><path d="m7 20 5-6 4 4 3-3 4 5"/>
  </g>
  <g transform="translate(1004 30)" fill="none" stroke="#f2f1ef" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <rect x="0" y="0" width="29" height="29" rx="7" fill="#080a0d" fill-opacity=".5" stroke-opacity=".8"/>
    <path d="M14.5 5.2 17 6.1l.5 2.2 1.8 1.1 2.2-.6 1.4 2.4-1.4 1.8v2.1l1.4 1.8-1.4 2.4-2.2-.6-1.8 1.1-.5 2.2-2.5.9-1.5-1.7h-2.1l-1.5 1.7-2.5-.9-.5-2.2-1.8-1.1-2.2.6L1 16.9l1.4-1.8V13L1 11.2l1.4-2.4 2.2.6 1.8-1.1.5-2.2 2.5-.9 1.5 1.7h2.1z" transform="translate(4 0) scale(.83)"/><circle cx="14.5" cy="14.5" r="3.4"/>
  </g>
  <!-- Discord button -->
  <g transform="translate(1047 30)" filter="url(#shadow)">
    <rect width="29" height="29" rx="7" fill="#080a0d" fill-opacity=".65" stroke="#fff" stroke-opacity=".7" stroke-width="1.8"/>
    <path d="M8 9.5c4.2-2 8.8-2 13 0 1.1 1.7 1.8 3.8 2 6.2-1.4 2-3.1 3.1-5.2 3.8l-1.2-1.6c.8-.2 1.5-.6 2.1-1-.4.2-.8.4-1.2.5a11 11 0 0 1-6 0c-.4-.1-.8-.3-1.2-.5.6.4 1.3.8 2.1 1l-1.2 1.6C9.1 18.8 7.4 17.7 6 15.7c.2-2.4.9-4.5 2-6.2Z" fill="#f4f3f1"/>
    <circle cx="11" cy="14" r="1" fill="#20222b" stroke="none"/><circle cx="18" cy="14" r="1" fill="#20222b" stroke="none"/>
  </g>
  <g transform="translate(1090 30)" fill="none" stroke="#f2f1ef" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <rect x="0" y="0" width="29" height="29" rx="7" fill="#080a0d" fill-opacity=".5" stroke-opacity=".8"/><path d="M6 17c3.5 0 4-2 5-5h7c1 3 1.5 5 5 5v4H6z"/><path d="M10 12c.5-2 2-3 4.5-3s4 1 4.5 3"/>
  </g>
  <g transform="translate(1133 30)" fill="none" stroke="#f2f1ef" stroke-width="2.4" stroke-linecap="round" filter="url(#shadow)">
    <rect x="0" y="0" width="29" height="29" rx="7" fill="#080a0d" fill-opacity=".5" stroke-opacity=".8"/><path d="m8 8 13 13M21 8 8 21"/>
  </g>
  <!-- centered KC mark -->
  <g filter="url(#shadow)">
    <circle cx="600" cy="229" r="65" fill="#07090d" fill-opacity=".2" stroke="#fff" stroke-width="11" stroke-dasharray="365 44" transform="rotate(-36 600 229)"/>
    <text x="600" y="249" text-anchor="middle" fill="#fff" font-size="50" font-weight="900" letter-spacing="-4">KC</text>
    <path d="M622 252h40" stroke="#fff" stroke-width="3"/><path d="m645 248 18 2-12 5" fill="#fff"/>
  </g>
  <text x="600" y="321" text-anchor="middle" fill="#fff" font-size="22" font-weight="600" filter="url(#shadow)">Kruth Client</text>
  <!-- vanilla-looking translucent buttons -->
  <g filter="url(#shadow)">
    <rect x="421" y="360" width="358" height="42" rx="10" fill="#050609" fill-opacity=".84" stroke="#fff" stroke-opacity=".07"/>
    <text x="600" y="386" text-anchor="middle" fill="#f4f3f1" font-size="16">Singleplayer</text>
    <rect x="421" y="412" width="358" height="42" rx="10" fill="#050609" fill-opacity=".84" stroke="#fff" stroke-opacity=".07"/>
    <text x="600" y="438" text-anchor="middle" fill="#f4f3f1" font-size="16">Multiplayer</text>
  </g>
  <!-- Discord hint; partner tile intentionally absent -->
  <g transform="translate(540 474)"><rect width="120" height="32" rx="16" fill="#11131c" fill-opacity=".72" stroke="#fff" stroke-opacity=".13"/><circle cx="17" cy="16" r="10" fill="#5865f2"/><path d="M11 13c4-2 8-2 12 0 .7 1.3 1 2.5 1 4-1.1 1.3-2.3 2-4 2.5l-.8-1.2c.6-.2 1.1-.4 1.5-.7-2 .9-4.4.9-6.4 0 .5.3 1 .5 1.6.7l-.8 1.2c-1.7-.5-2.9-1.2-4-2.5 0-1.5.3-2.7 1-4Z" fill="#fff"/><text x="34" y="21" fill="#f5f4fa" font-size="13" font-weight="600">Join Discord</text></g>
  <!-- footer -->
  <text x="27" y="645" fill="#efeeeb" font-size="15" font-weight="600">Kruth Client v1.8.9</text>
  <text x="1173" y="645" text-anchor="end" fill="#efeeeb" font-size="15" font-weight="600">Copyright Mojang Studios</text>
  <rect x="15" y="15" width="1170" height="645" rx="10" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="2"/>
</svg>
